[project]
name = "awesome-python-project"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14.1"
dependencies = [
    "playwright",
]

[project.license]
file = "LICENSE"

[project.optional-dependencies]
test = [
    "covdefaults",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist",
    "time-machine",
]

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

[tool.autoflake]
recursive = true

[tool.isort]
# Compatible with black; one import per line (the style reorder-python-imports used).
profile = "black"
line_length = 99
force_single_line = true

[tool.mypy]
files = "."
ignore_missing_imports = true
strict = true
exclude = [
    "tests/",
]

[tool.coverage.run]
plugins = [
    "covdefaults",
]
# Playwright's sync API runs on greenlets; without this, lines after browser calls look unrun.
concurrency = [
    "greenlet",
    "thread",
]
omit = []

[tool.coverage.html]
directory = "artifacts/htmlcov/"
